<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' wss://speech.platform.bing.com">
  <title>ZENO Assistant</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div id="island">
    <div id="island-top">
      <div id="island-orb"><span></span></div>
      <div id="island-text">
        <div id="island-state">ZENO</div>
        <div id="island-line">what can I do for you?</div>
      </div>
      <div id="island-wave">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <button type="button" id="island-expand" title="open full ZENO">◱</button>
      <button type="button" id="island-close" title="hide (ctrl+y)">✕</button>
    </div>
    <div id="island-quick">
      <button type="button" class="quick" data-act="mic" title="voice">MIC</button>
      <button type="button" class="quick" data-cmd="play-pause" title="play or pause">PLAY</button>
      <button type="button" class="quick" data-cmd="next" title="next track">NEXT</button>
      <button type="button" class="quick" data-cmd="volume-down" title="volume down">VOL-</button>
      <button type="button" class="quick" data-cmd="volume-up" title="volume up">VOL+</button>
      <button type="button" class="quick" data-cmd="mute" title="mute">MUTE</button>
      <button type="button" class="quick" data-cmd="screenshot" title="screenshot">SNAP</button>
      <button type="button" class="quick" data-cmd="lock" title="lock pc">LOCK</button>
    </div>
    <div id="island-reply"></div>
    <form id="island-form">
      <input id="island-input" type="text" placeholder="say or type anything..." autocomplete="off">
      <button type="submit" id="island-send">GO</button>
    </form>
  </div>
  <script src="js/commands.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
